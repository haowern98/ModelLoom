name: ModelLoom checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; version from package.json
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          (cd "$RUNNER_TEMP/actionlint" && echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/checks.yml
      - name: Type checking
        run: pnpm typecheck
      - name: Linting
        run: pnpm lint
      - name: Unit and component tests
        run: pnpm test
      - name: Production renderer build
        run: pnpm build

  browser:
    name: Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm --filter @modelloom/desktop exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows desktop
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: components/tailscale/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Windows x64 Electron archive
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-windows-x64-${{ hashFiles('apps/desktop/package.json', 'pnpm-lock.yaml') }}
      - name: Prefetch verified Electron archive
        shell: pwsh
        run: |
          @'
          import { readFileSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';
          import { downloadArtifact } from '@electron/get';

          const { devDependencies } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
          const checksums = JSON.parse(readFileSync('node_modules/electron/checksums.json', 'utf8'));
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              await downloadArtifact({
                version: devDependencies.electron,
                artifactName: 'electron',
                platform: 'win32',
                arch: 'x64',
                checksums,
                downloadOptions: { signal: AbortSignal.timeout(120_000) },
              });
              break;
            } catch (error) {
              if (attempt === 3) throw error;
              console.warn(`Electron prefetch attempt ${attempt} failed: ${error.message}`);
              await delay(attempt * 1000);
            }
          }
          '@ | node --input-type=module
          exit $LASTEXITCODE
      - name: Package unsigned demo
        # Packaging verifies the bundled helper; users never build it themselves.
        run: pnpm --filter @modelloom/core build:network && pnpm package:demo
      - name: Packaged desktop smoke test
        run: pnpm test:desktop
      - name: Retain failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-failure-evidence
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history for secrets
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --log-opts="--all" .'
      - name: Dependency vulnerability audit
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        run: pnpm audit --audit-level high --json > dependency-audit.json
      - name: Retain dependency audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 7
