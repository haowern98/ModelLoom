name: Embedded networking

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    name: Networking (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-amd64
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: components/tailscale/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Test component
        working-directory: components/tailscale
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOFLAGS: -mod=readonly
        run: go test ./...
      - name: Build component
        run: node packages/core/scripts/build-network.mjs --target ${{ matrix.target }}
      - name: Verify artifact
        run: node packages/core/scripts/build-network.mjs --target ${{ matrix.target }} --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modelloom-network-${{ matrix.target }}
          path: components/tailscale/out/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 7
